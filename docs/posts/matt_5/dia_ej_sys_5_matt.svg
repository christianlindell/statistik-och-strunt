<text x='605.19' y='247.08' style='font-size: 10.40px; font-family: "Arial";' textLength='109.20px' lengthAdjust='spacingAndGlyphs'>förvärvsinkomst ej 3 ibb</text>
<text x='605.19' y='264.36' style='font-size: 10.40px; font-family: "Arial";' textLength='119.03px' lengthAdjust='spacingAndGlyphs'>ej självförsörjande eforum</text>
<text x='605.19' y='281.64' style='font-size: 10.40px; font-family: "Arial";' textLength='102.86px' lengthAdjust='spacingAndGlyphs'>ej självförsörjande svn</text>
<text x='605.19' y='298.92' style='font-size: 10.40px; font-family: "Arial";' textLength='153.69px' lengthAdjust='spacingAndGlyphs'>ej huvudinkomst fr förvärvsarbete</text>
<text x='605.19' y='316.20' style='font-size: 10.40px; font-family: "Arial";' textLength='56.62px' lengthAdjust='spacingAndGlyphs'>ej sysselsatt</text>
<text x='6.48' y='53.56' style='font-size: 13.00px; font-family: "Arial";' textLength='706.69px' lengthAdjust='spacingAndGlyphs'>Andel som inte når upp till en förvärvsinkomst på 3 inkomstbasbelopp (SCB), andel som inte når upp till en förvärvsinkomst</text>
<text x='6.48' y='67.60' style='font-size: 13.00px; font-family: "Arial";' textLength='694.30px' lengthAdjust='spacingAndGlyphs'>på 4 prisbasbelop ('Självförsörjning' enligt Entreprenörskapsforum), andel som inte når upp till en förvärvsinkomst på fyra</text>
<text x='6.48' y='81.64' style='font-size: 13.00px; font-family: "Arial";' textLength='683.46px' lengthAdjust='spacingAndGlyphs'>prisbasbelopp och inte var studerande ('självförsörjning' enligt Sv Näringsliv), huvudinkomst från förvärvsarbete (SCB:s</text>
